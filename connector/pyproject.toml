[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weyland-mcp"
version = "0.0.1"
description = "Weyland MCP connector — remote control for a single minion Pi"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.27.0,<2",
  "starlette>=0.37",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.5",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
weyland-mcp = "weyland_mcp.__main__:main"
